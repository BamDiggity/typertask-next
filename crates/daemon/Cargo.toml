[package]
name = "typertask-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
typertask-engine = { path = "../engine" }
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
